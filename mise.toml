[tools]
"aqua:artempyanykh/marksman" = "2026-02-08"
"aqua:tamasfe/taplo" = "0.10.0"
bun = "1.3.14"
node = "24.18.0"
"npm:typescript" = "7.0.2"
"npm:typescript-language-server" = "6.0.0"
"github:qltysh/qlty" = "0.644.0"
prek = "0.5.2"

[tasks.validate-package]
description = "Validate the Senpi package manifest and import boundary"
run = "bun scripts/validate-package.ts"

[tasks.typecheck]
description = "Run the TypeScript compiler without emitting files"
run = "bunx tsc --noEmit"

[tasks.test]
description = "Run the Bun regression suite"
run = "bun test"

[tasks.build]
description = "Bundle the OMO extension with Bun"
run = "bun build extensions/better-custom/src/index.ts extensions/compound-engineering/src/index.ts extensions/herdr/index.ts extensions/model-routing-advisor/index.ts extensions/trim/src/index.ts --outdir .build-check --target bun && rm -rf .build-check"

[tasks.quality]
description = "Validate sources with Biome and run Qlty checks"
run = "biome check --formatter-enabled=false --linter-enabled=false --skip=assist/source/organizeImports . && qlty check --all"

[tasks.hooks]
description = "Validate prek hook configuration"
run = "prek validate-config prek.toml"

[tasks.version-recommend]
description = "Recommend a SemVer bump from Conventional Commits"
run = "bun run version:recommend"

[tasks.changelog]
description = "Update release history from Conventional Commits"
run = "bun run changelog"

[tasks.configure-omo-preferences]
description = "Apply portable OMO user preferences without overwriting settings"
run = "bun run configure:omo-preferences"

[tasks.repair-omo-comment-checker]
description = "Install OMO's missing global comment-checker dependency"
run = "bun run repair:omo-comment-checker"

[tasks.ci]
description = "Run the complete local CI gate"
depends = ["validate-package", "typecheck", "test", "build", "quality", "hooks"]
